[package]
name = "mihoyo-schedule-tracker"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
description = "米哈游（原神 / 崩坏：星穹铁道 / 绝区零）版本开启时间与前瞻特别节目预测日历"
license = "MIT"

[dependencies]
# Web 框架
axum = { version = "0.8", features = ["json", "query", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tower-http = { version = "0.7", features = ["fs", "cors", "compression-gzip", "trace"] }

# SQLite 持久化（sqlite 特性自带 bundled libsqlite3，无需系统依赖）
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "macros"] }

# 序列化 / 时间 / 正则 / HTTP 客户端（reqwest 0.13：rustls 特性 = aws-lc-rs + rustls-platform-verifier 读取系统 CA）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "rustls"] }

# 日志与配置
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dotenvy = "0.15"

[dev-dependencies]
# 测试专用：tokio::time::advance / start_paused（仅测试构建启用，生产构建不受影响）
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
